name: Build Keepit KB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"        # weekly, Sunday 00:00 UTC

concurrency:
  group: build-kb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build knowledge base
        run: python build_kb.py --out kb 2>&1 | tee build.log

      - name: Commit changes if any
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(kb): weekly refresh [skip ci]"
            git push
          fi

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log')
              ? fs.readFileSync('build.log','utf8').slice(-3000) : '(no log)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `KB build failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['kb','bug'],
              body: `The scheduled build failed.\n\nRun: ${run}\n\n\`\`\`\n${log}\n\`\`\``,
            });
