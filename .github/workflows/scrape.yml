name: Scrape Keepit content

on:
  workflow_dispatch:              # manual run
  schedule:
    - cron: "0 0 * * 0"          # weekly, Sunday 00:00 UTC
  push:
    branches: [main]
    paths:                        # only when the scraper itself changes,
      - scraper.py                # not on every content commit
      - requirements.txt
      - .github/workflows/scrape.yml

# Prevent overlapping runs.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # commit results
      issues: write               # open an issue on failure

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        id: scrape
        run: python scraper.py 2>&1 | tee scrape.log

      # Runs even if the scraper failed, so the failure gets recorded in
      # data/refresh_log.json and committed. The job is still marked failed
      # (the scraper's non-zero exit), so the issue step below fires and the
      # run shows red.
      - name: Commit changes if any
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(scraper): update Keepit content [skip ci]"
            git push
          fi

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('scrape.log')
              ? fs.readFileSync('scrape.log', 'utf8').slice(-3000)
              : '(no log captured)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scraper run failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['scraper', 'bug'],
              body: `The scheduled scraper run failed.\n\nRun: ${run}\n\n\`\`\`\n${log}\n\`\`\``,
            });
